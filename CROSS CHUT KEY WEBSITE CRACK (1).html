<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CROSS MODS MERA LOWRA ME</title>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<style>
*{
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    margin:0;
    overflow:hidden;
    color:#00ffff;
}

#particles-js{
    position:fixed;
    width:100%;
    height:100%;
    z-index:-1;
    background:#000;
}

.header{
    padding:15px;
    display:flex;
    justify-content:space-between;
    color:#ff00ff;
    font-weight:bold;
}

.welcome{
    background:rgba(0,255,255,0.1);
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    color:#00ffcc;
    font-weight:bold;
}

.container{padding:15px;}

.card{
    background:rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius:16px;
    padding:20px;
    box-shadow:0 0 20px rgba(0,255,255,0.3);
}

.input-group{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    margin-bottom:12px;
}

.icon{
    width:45px;
    text-align:center;
    padding:10px;
    color:#ff00ff;
}

.input-group input,
.input-group select{
    flex:1;
    border:none;
    outline:none;
    padding:12px;
    background:transparent;
    color:#00ffff;
}

.btn{
    margin-top:15px;
    width:150px;
    padding:12px;
    background:linear-gradient(45deg,#ff00ff,#00ffff);
    border:none;
    border-radius:10px;
    color:#fff;
    cursor:pointer;
}

.toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:#00ffcc;
    color:#000;
    padding:10px 18px;
    border-radius:8px;
    display:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="header">
    <div>⬜ CROSS MODS MERA LOWRA ME</div>
    ☰
</div>

<div class="container">

<div class="welcome">
    <div>🔥 Welcome PAPA JI SUVAM CRACKER </div>
    ✖
</div>

<div class="card">
    <h3 style="color:#ff00ff;">Create Key - Global</h3>

    <div class="input-group">
        <div class="icon">🎮</div>
        <select>
            <option>Free Fire</option>
        </select>
    </div>

    <div class="input-group">
        <div class="icon">📱</div>
        <input type="number" value="1" readonly>
        <div style="padding:10px;">device</div>
    </div>

    <div class="input-group">
        <div class="icon">📅</div>
        <select>
            <option>1 Days</option>
        </select>
    </div>

    <div class="input-group">
        <div class="icon">💎</div>
        <select>
            <option>FREE</option>
            <option>PAID</option>
        </select>
    </div>

    <button class="btn" onclick="startProcess()">⤴ Generate</button>

</div>

</div>

<div class="toast" id="toast"></div>

<script>
// PARTICLES
particlesJS("particles-js", {
  particles: {
    number: { value: 60 },
    color: { value: ["#00ffff","#ff00ff","#00ff00"] },
    shape: { type: "triangle" },
    opacity: { value: 0.5 },
    size: { value: 4 },
    move: { enable: true, speed: 2 }
  }
});

// VOICE
function speak(text){
    if ('speechSynthesis' in window) {
        let msg = new SpeechSynthesisUtterance(text);
        msg.lang = "en-IN";
        speechSynthesis.speak(msg);
    }
}

// AUTO SYSTEM
let step = parseInt(localStorage.getItem("step")) || 0;

function startProcess(){
    localStorage.setItem("step",1);
    location.reload();
}

// PAGE LOAD LOGIC
window.onload = function(){

    let toast = document.getElementById("toast");

    if(step === 1){
        localStorage.setItem("step",2);
        toast.innerText = "🔄 Refreshing...";
        toast.style.display="block";

        setTimeout(()=> location.reload(),800);
    }

    else if(step === 2){
        localStorage.setItem("step",3);
        toast.innerText = "🔄 Final Refresh...";
        toast.style.display="block";

        setTimeout(()=> location.reload(),800);
    }

    else if(step === 3){
        localStorage.removeItem("step");

        toast.innerText = "🚀 Opening Link...";
        toast.style.display="block";

        speak("Key generate start");

        setTimeout(()=>{
            window.location.href = "https://urlking.in/0b4uzk";
        },1000);
    }
}
</script>

</body>
</html>
